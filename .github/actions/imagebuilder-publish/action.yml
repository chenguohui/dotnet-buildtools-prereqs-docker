name: Build and push images with ImageBuilder

description: >
  Builds the given Dockerfile paths with ImageBuilder and pushes the resulting images to
  ghcr.io/<owner>/<repo>. The caller must log in to that registry beforehand.

inputs:
  paths:
    description: >
      Comma-separated list of Dockerfile paths relative to the repo root, e.g.
      "src/azurelinux/3.0/net10.0/cross/loongarch64".
    required: true

runs:
  using: composite
  steps:
    # Get-ImageBuilder.ps1 pulls the ImageBuilder container image and loads its reference
    # into ${imageNames.imagebuilderName} for the rest of this step's session.
    #
    # Stage-EngCommon.ps1 copies eng/common next to every Dockerfile that declares
    # `COPY eng/common/...`, because ImageBuilder's build context is the Dockerfile's own
    # directory rather than the repo root. This is what the Azure DevOps pipelines pass as
    # customPreImageBuilderBuildSteps and what build.ps1 does before invoking ImageBuilder;
    # without it every such Dockerfile fails with
    #   failed to compute cache key: "/eng/common/cross": not found
    # Staging has to happen before the repo is baked into the with-repo image below.
    - name: Build the ImageBuilder-with-repo image
      shell: pwsh
      run: |
        ./eng/docker-tools/Get-ImageBuilder.ps1
        ./eng/Stage-EngCommon.ps1
        docker build -t microsoft-dotnet-imagebuilder-withrepo `
          --build-arg "IMAGE=${imageNames.imagebuilderName}" `
          -f eng/docker-tools/Dockerfile.WithRepo .

    # The stock Invoke-ImageBuilder.ps1 runs the ImageBuilder container with only the docker
    # socket mounted, so the credentials written by docker/login-action never reach it. Run
    # the container directly and mount the docker config as well so that the `docker push`
    # (and the `docker pull` of parent images) performed inside the container are
    # authenticated.
    #
    # Naming: ImageBuilder pushes to <registry-override>/<manifest repos[].name>:<tag>. The
    # manifest carries this repo's own name (src/azurelinux/manifest.json) so images land on
    # ghcr.io/<owner>/<repo> with the upstream tag strings unchanged; the workflow's
    # `preflight` job fails fast if the manifest name and the GitHub repo name ever diverge.
    #
    # --base-override-* rewrites the FROM lines that reference mcr.microsoft.com/
    # dotnet-buildtools/prereqs (the lns8 images depend on parents that only exist in this
    # GHCR repo), so $TARGET_REPO has to be both the push target and the override value.
    - name: Build and push
      shell: bash
      env:
        TARGET_REPO: ghcr.io/${{ github.repository }}
      run: |
        set -euo pipefail

        args=()
        IFS=',' read -ra paths <<< "${{ inputs.paths }}"
        for path in "${paths[@]}"; do
          args+=(--path "${path// /}")
        done

        docker rm -f imagebuilder > /dev/null 2>&1 || true

        docker run --name imagebuilder --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "$HOME/.docker:/root/.docker" \
          microsoft-dotnet-imagebuilder-withrepo build \
          --manifest manifest.json \
          "${args[@]}" \
          --registry-override "${TARGET_REPO%%/*}" \
          --base-override-regex '^mcr\.microsoft\.com/dotnet-buildtools/prereqs' \
          --base-override-sub "${TARGET_REPO}" \
          --source-repo "${{ github.server_url }}/${{ github.repository }}" \
          --push

    # Mirror of the staging above, like build.ps1's finally block: keeps the working tree
    # clean for whatever runs after this action (and on a self-hosted runner, for the next
    # job that reuses the same workspace).
    - name: Unstage eng/common
      if: ${{ always() }}
      shell: pwsh
      run: ./eng/Stage-EngCommon.ps1 -Clean
